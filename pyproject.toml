[project]
name = "ar-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "numpy>=1.26", "pillow>=10.0", "imagehash>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ar = "ar_kernel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "manual: GPU verification, run explicitly",
    "gpu: launches a real GPU job (the gate's describe step); run with -m gpu",
]
# Spec 16.1: the default unit suite uses no GPU. A GPU test running alongside a
# real job has already produced a spurious gate failure through contention.
addopts = "-q -m 'not manual and not gpu'"
