[project]
name = "ar-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0", "numpy>=1.26", "pillow>=10.0", "imagehash>=4.3",
    "fastapi>=0.141", "uvicorn>=0.53", "httpx>=0.28", "httpx2==2.13.0", "pydantic>=2.12",
    "mcp==2.2.0",
    "langgraph==1.2.11", "langchain-core==1.6.3", "langchain-openai==1.6.2", "openai>=1.92",
    "huggingface_hub>=1.32", "zstandard>=0.25",
    "psutil>=7.2", "python-dotenv>=1.2", "docker>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "langchain==1.4.2", "arxiv>=4.0"]
panel = ["gradio==6.28.0", "plotly>=6", "pygments>=2.21"]

[project.scripts]
ar = "ar_kernel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["kernel", "contract"]

[tool.setuptools.package-data]
ar_kernel = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "kernel"]
markers = [
    "manual: GPU verification, run explicitly",
    "gpu: launches a real GPU job (the gate's describe step); run with -m gpu",
    "docker: starts real containers; run with -m docker",
    "real_preflight: uses the real eval prerequisite check instead of the test stub",
]
# The default unit suite uses no GPU. A GPU test running alongside a
# real job has already produced a spurious gate failure through contention.
addopts = "-q -m 'not manual and not gpu and not docker'"
