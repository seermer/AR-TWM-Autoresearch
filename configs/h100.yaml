# `ar run --config configs/h100.yaml [skill config]`: an 8 x H100 80GB machine. Only the keys that differ from kernel.yaml.
# Run scripts/preflight.py --config configs/h100.yaml on a new machine before the first run.
gpus:
  num_gpus: 8
host:
  ram_gib: 704                    # scripts/sbatch_run.sh asks for --mem=768G
train:
  base_recipe: configs/base_recipe_h100.yaml
eval:
  # The stage2b ViGeo cache and a whole-video VAE decode (wbench_full.yaml cuts both to fit 24 GB cards).
  render_overrides:
    spatial_memory: {vigeo_cache_budget: 262144}
    runtime: {vae_decode_chunk_latents: 161, vae_decode_overlap_latents: 0}
  local_judge_workers: 32
captioner:
  min_total_gpu_gib: 560
  model: Qwen/Qwen3.8-Flash-Next  # bf16; its 51B n-gram embedding table sits in host RAM (vLLM's default on 80 GB cards)
  tensor_parallel: 8
  peak_rss_gib: 215              # the server's host RAM, measured (sbatch_measure.sh): 45 GiB anon + 134 GiB shared
                                 # memory; page cache (465 GiB of weights) is not counted: the kernel reclaims it
  gpu_memory_utilization: 0.9
  max_num_seqs: 256              # vLLM's recipe value; fewer can fail the hybrid-attention cache check at startup
  concurrent_requests: 64
  max_num_batched_tokens: 32768  # as kernel.yaml: the same video processor as Qwen3.8-27B
  extra_args: [--enable-expert-parallel, --moe-backend, triton, --enable-ep-weight-filter, --enable-prefix-caching,
               --kv-cache-dtype, fp8, --attention-config.indexer_kv_dtype, fp8]
annotate:
  workers: 8
images:
  workers: 8
  offload: none
generators:
  wan22:
    workers: 8
  h3:
    attn_type: flash_attn3        # FlashAttention 3; SageAttention picks an fp8 kernel on H100 that renders H3 as noise
    config: configs/h3_lightx2v_h100.json   # the DiT on the GPU (47.5 GB per card measured), no block offload
    max_items: 100
    peak_rss_gib: 100             # measured: 31 GiB anon + 52 GiB shared memory
  ltx25:
    quantization: none            # bf16 weights on the GPU: no host copy, no per-layer streaming
    offload: none
    workers: 8
    peak_rss_gib: 3               # measured with 8 workers: 15 GiB anon + 26 GiB shared memory in all; the weights
    shared_gib: 32                # load to the GPU through page cache, not counted (the kernel reclaims it)
