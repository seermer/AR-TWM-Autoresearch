# `ar run --config configs/animal_appears.yaml`: score the animal_appears skill benchmark instead of the default cases.
# Only the keys that differ from kernel.yaml.
eval:
  data: ../WBench/data_animal_appears
  cases: configs/animal_appears_cases.txt
  proxy_size: 60
  score_weights:
    event_edit_adherence: 16     # the skill: half the score, the 16 other metrics the cases list the rest
  target_skill:
    name: an animal appearing
    sentence: an animal appears where the text says
    description: no animal is in view when the video starts. When a turn's text says an animal appears, that animal comes into view during that turn, at the place the text names. It can be any land animal. This can happen in any turn, including the first and the last, and in one or several turns of a video
