paths:
  worldmodel: ../WorldModel
  wbench: ../WBench
  runs_dir: runs
  root_cache: root_cache           # scored roots shared across runs, one dir per run.root_key
  scores_dir: scores               # `ar score-node` output, one dir per <run>-<node>-<time>; never inside a run
gpus:
  num_gpus: 4                     # the run takes the first num_gpus free cards; a positive multiple of min_count
  min_count: 4
  # Each GPU tool's block has `min_total_gpu_gib`: the memory it needs across the run's cards, an
  # estimate of 96 (4 x 24 GB) or 48 (2 x 24 GB). A run does not start while an enabled tool needs more.
  free_below_mib: 512            # a kernel GPU job an agent asked for is refused while a GPU holds more than
                                 # this (the agent sandbox sees the same GPUs; a display server uses less)
retries:
  edit_self: 3
  improve_recipe: 3
budget:                          # run-wide LLM spend cap in dollars, enforced by the gateway
  max_usd: null                  # null = no cap (the default)
  usd_per_mtok: {input: null, cached_input: null, output: null}   # needed for max_usd and for cost in `ar status`
alerts:
  stall_min: 30
  gateway_error_rate: 0.2
  gateway_error_window_min: 5
selection:                       # continuous softmax parent selection
  decay: 0.5                     # weight per generation below a node: child 1x decay, grandchild decay^2 ...
  prior_weight: 1.0               # the node's own score as one virtual child: pulls the subtree mean toward it
  subtree_share: 0.3              # value = (1 - share) * own score + share * subtree mean
  size_scale: 4                   # size penalty 1 / (1 + size / scale); size = descendants, decayed per generation
  temperature: 2.0                # softmax temperature, in units of the spread of values across candidates
  noise_floor: 4.4e-4              # the spread never counts as smaller than proxy noise
  epsilon: 0.2                    # this share of probability is spread uniformly over all candidates
ingest:
  aspect_tolerance: 0.02
  workers: 8                      # clips checked at a time (each check is a few CPU subprocesses)
leakage:
  phash_max_distance: 4
  min_ncc: 0.95
  min_entropy: 4.0
isolation:                       # keeps the evaluation set out of agents' reach
  blocked_names: [wbench]        # case-insensitive substrings: a Hub repo naming one does not exist for agents,
                                 #   and in the kernel's own output (file names) it reads `render`
  audit_patterns: [wbench, meituan-longcat, "2605.25874"]   # the model writing one quarantines the node;
                                 #   the gateway drops the sentence around one in anything else it reads
train:
  base_recipe: configs/base_recipe.yaml   # the WorldModel training config every node's recipe edits
  lora_allowlist: [[16, 16], [32, 32], [64, 64]]
eval:
  data: ../WBench/data           # the scored benchmark: cases/, images/, masks/
  cases: configs/proxy_cases.txt
  proxy_size: 50                 # the run scores the first N cases of `cases`
  # A run scores the metrics its cases list (`metric_list`); one of them missing from an eval fails it.
  # Weight of each metric in a node's score (a metric not listed weighs 1). These four are the
  # instruction-following and causal grades; at 4.5 each they are half the score, the other 18 the rest.
  score_weights:
    event_edit_adherence: 4.5
    subject_action_adherence: 4.5
    perspective_switch_adherence: 4.5
    causal_fidelity: 4.5
  # The one skill a run aims to improve, as its data roles are told it: `name` (a phrase), `sentence`
  # (a short clause) and `description` (the full statement). Empty: the run aims at no single skill.
  target_skill: {}
  vp_weights: weights/qwen3vl-a3b-visual-plausibility
  render_overrides: {}           # keys replaced in WorldModel's configs/wbench_full.yaml, for the eval and rollout_alayaworld
  local_judge_workers: 8         # VLM requests WBench keeps in flight to a local judge
  judge:                         # local judge (used when VLM_API_KEY is empty): the captioner's model
    # WBench asks for a 10-token yes/no answer, so the model must not think first.
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    max_images: 64               # frames per prompt: causal_fidelity sends a whole video as images
disk:
  alert_below_gb: 50
telemetry:
  gpu_sample_sec: 5
tools:
  job_wait_max_s: 3600
  failure_alert_after: 3          # a tool failing this many times in a row records an alert
ask:                             # the ask tool: one stateless question to the agent's model
  max_images_per_phase: 100      # per phase attempt, shared by all its roles; a question without images is not limited
  max_images_per_call: 8
  max_image_side: 1024           # px; larger images are downscaled before they are sent
captioner:                       # caption_videos GPU job: a local vLLM server, never the paid agent model
  env: vllm             # conda env with vLLM (0.32.0), lives in .envs/vllm
  min_total_gpu_gib: 96          # the launch below was tuned on 4 x 24 GB
  model: Qwen/Qwen3.8-27B-FP8    # resolved by id through the HF cache (HF_HUB_OFFLINE=1: never downloads)
  tensor_parallel: null          # null = the largest power of two <= the number of node GPUs
  # vLLM test-runs the vision encoder at startup on min(max_num_batched_tokens / 12288, max_num_seqs)
  # max-size videos.
  max_model_len: 81920
  gpu_memory_utilization: 0.90
  max_num_seqs: 20
  concurrent_requests: 20        # clips (locate_events: frames) sent at once; the server batches them
  # vLLM sizes the encoder cache as max(max_num_batched_tokens, its estimate of one video's tokens); the
  # estimate (12288) is exceeded by clips with an odd sampled frame count (1080p, 13 frames: 14280 tokens),
  # which vLLM rejects with HTTP 400.
  max_num_batched_tokens: 32768
  reasoning_parser: qwen3        # the model reasons; its reasoning is recorded per clip, not returned
  reasoning_effort: low          # sent with each request (the chat template takes low / medium / xhigh)
  mm_encoder_tp_mode: data       # each GPU runs the vision encoder on its share of the videos
  speculative_config: null       # e.g. {method: mtp, num_speculative_tokens: 3}; off by default
  media_io_kwargs: {video: {num_frames: 64, fps: 2}}   # vLLM's Qwen3-VL loader ignores num_frames: it samples
                                 # 2 frames/s (4..768) and resizes frames to the model's video pixel budget
  clip_timeout_s: 300
  memory_release_timeout_s: 120  # after the server stops, wait up to this long for GPU memory to free
  extra_args: []                 # more `vllm serve` flags
locate_events:                   # locate_events GPU job: the captioner's model, served for images
  reasoning_effort: low          # sent with each request (low / medium / xhigh)
  frame_width: 960               # pixels of one frame, the image of one request
  request_timeout_s: 300         # one frame
gateway:
  model_allowlist: []            # OPENAI_MODEL from the environment is always allowed too
  upstream_timeout_s: 600
  upstream_wait_s: 1800          # 408/429/5xx/connection errors, and a 4xx the provider also gives a tiny probe
                                 #   request, are retried with backoff this long; then the phase runs again
agents:                          # passed to agent sandboxes as AR_CONTEXT_WINDOW / AR_COMPACT_AT
  context_window_tokens: 1000000 # set to the agent model's context window (deepseek-flash: 1M)
  compact_at: 0.6                # the harness auto-compacts at this fraction of the window
sandbox:
  shm_gb: 64                     # /dev/shm of the edit_self and improve_recipe sandboxes
annotate:                         # annotate_camera GPU job
  enabled: true
  env: alayaworld
  min_total_gpu_gib: 48
  repo: third_party/ViGeo         # relative to paths.worldmodel
  checkpoint: third_party/ViGeo/checkpoints/ViGeo1.1
  max_frames: 1200                # longer clips are refused per clip (memory)
images:                           # generate_images GPU job (Z-Image-Turbo first frames)
  enabled: true                   # verified: 8 prompts on 4 GPUs, gpu_memory_released true
  env: .envs/gen-zimage           # a conda-prefix env inside the repo
  min_total_gpu_gib: 48
  weights: weights/z-image-turbo
  revision: f332072aa78be7aecdf3ee76d5c247082da564a6
  steps: 9
  default_size: [544, 960]        # [height, width]
  offload: model                  # from the fit spike: `none` OOMs at 1920x1088 (peaks > 24 GB);
                                   # `model` (enable_model_cpu_offload) fits every allowed size, peak 12.8 GB
generators:                       # rollout_* GPU jobs; switched on only after a smoke run
  alayaworld:
    env: alayaworld
    min_total_gpu_gib: 48         # the prompt precache spreads Gemma over two cards
    # Rendered with the 30-step AR teacher (the DMD LoRA off). Clips carry no pose; agents run annotate_camera.
    enabled: true
    max_turns: 9
  wan22:
    env: .envs/gen-wan22           # a conda-prefix env inside the repo
    min_total_gpu_gib: 48
    repo: third_party/Wan2.2      # relative to the AutoResearcher repo; gitignored
    commit: 1ea34ff48f87168174e12956e200b1d908b1c5ff   # pinned; the backend refuses to run off this commit
    weights: weights/wan2.2-ti2v-5b
    enabled: false
    # Not under the size rule of the other tools: it still crops a first frame to 1280x704 and crops its
    # render to 1248x704. Bring it under the rule (gpu_jobs.check_size, frame_keys) before switching it on.
    gpus_per_worker: 1
    workers: null                 # null = as many as the GPU list allows
    frames: [121, 121]            # [default, max]; 4k+1
    # Fit test (1280x704, 121 frames, 50 steps, 24 GB card): no-offload OOMs in the VAE
    # decode; T5 on GPU is no faster (9:41 vs 9:24 wall). Peak 22.9 GiB allocated: the whole card.
    extra_args: {offload_model: true, t5_cpu: true}
  ltx25:
    env: .envs/gen-ltx25           # a conda-prefix env inside the repo
    min_total_gpu_gib: 48
    repo: third_party/LTX-2       # relative to the AutoResearcher repo; gitignored
    commit: a95ab856bf29407b6b066ede0abe1846050db56c   # pinned; the backend refuses to run off this commit
    weights: weights/ltx-2.5
    # The dev model (the distilled one dissolved between scenes; live-animal-10-19). peak_rss_gib: one
    # worker's private host RAM (1024x576x121): peak RSS is ~72 GiB, but half of it is the mmapped
    # weight files (page cache, shared by every worker); the private (RssAnon) peak is 36.8 GiB.
    # 1024x576x145-169 with 2-3 workers: 150-190 s/clip each, 12-14 GiB GPU peak.
    enabled: true
    peak_rss_gib: 40
    quantization: fp8-cast        # 24 GB cards: fp8-cast + CPU offload, one GPU per worker
    offload: cpu
    # host_reserve_gib also holds the ~36 GiB of shared mmapped weights, which MemAvailable counts as
    # free, so the reserve must leave room for them.
    host_reserve_gib: 100         # workers = min(GPUs, items, floor((MemAvailable - this) / peak_rss_gib)),
    workers: null                 # checked at job start; fails only below 1. Optional cap on the GPU count.
    frames: [121, 241]            # [default, max]; 8k+1
    resolutions: [[576, 1024]]    # [height, width], first = default; each divisible by 64 (two-stage) and
                                  # within ingest.aspect_tolerance of 16:9
  h3:
    env: .envs/gen-lightx2v         # a conda-prefix env inside the repo (LightX2V, SageAttention; FlashAttention 3 on H100)
    repo: third_party/LightX2V      # relative to the AutoResearcher repo; gitignored
    commit: 97853b1b12e5d29ef3e2b63b781a67b23c191d4c   # pinned; the backend refuses to run off this commit
    config: configs/h3_lightx2v.json   # LightX2V's shared block offload recipe: bf16 weights in one host copy
                                    # for all ranks, sequence parallel, SageAttention, parallel VAE decode
    attn_type: sage_attn2           # the DiT's attention; replaces attn_type in config
    min_total_gpu_gib: 96           # measured on 4 x 24 GB only
    weights: weights/minimax-h3     # MiniMaxAI/MiniMax-H3, diffusers layout, fl2va/t2va partition
    revision: 42ed227ee7df40d41602854ae760620d6eb651fe
    enabled: true
    frames: [243, 243]              # [default, max]; 17n+5, min 124. Every clip is 960x544
    max_items: 80
    peak_rss_gib: 140               # host RAM of one job; a job starts only while
    host_reserve_gib: 60            # MemAvailable - host_reserve_gib >= peak_rss_gib
