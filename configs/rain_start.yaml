# `ar run --config configs/rain_start.yaml`: score the rain_start skill benchmark instead of the default cases.
# Only the keys that differ from kernel.yaml.
eval:
  data: ../WBench/data_rain_start
  cases: configs/rain_start_cases.txt
  proxy_size: 60
  score_weights:
    event_edit_adherence: 16     # the skill: half the score, the 16 other metrics the cases list the rest
  target_skill:
    name: rain starting
    sentence: rain begins to fall
    description: the video starts without rain, and when a turn's text says rain begins to fall, rain starts during that turn. This can happen at any turn, including the first and the last
